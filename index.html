  <style>
    :root {
      --bg-paper: #E6DFD0;
      --bg-paper-light: #EDE7DA;
      --ink: #141210;
      --ink-deep: #12110F;
      --accent-slate: #3E5C7E;
      --seal-red: #9A332A;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-paper);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide native pointer on fine-pointer desktops when music cursor is active */
    @media (pointer: fine) {
      body.music-cursor-active,
      body.music-cursor-active a,
      body.music-cursor-active button,
      body.music-cursor-active input,
      body.music-cursor-active .cursor-interactive {
        cursor: none !important;
      }
    }

    /* Warm aged parchment paper surface with soft tonal mottling & ultra-subtle drafting lines */
    .paper-surface {
      background-color: var(--bg-paper);
      background-image:
        radial-gradient(ellipse 75% 55% at 16% 10%, rgba(252, 248, 238, 0.72) 0%, transparent 60%),
        radial-gradient(ellipse 65% 50% at 85% 24%, rgba(206, 195, 175, 0.34) 0%, transparent 62%),
        radial-gradient(ellipse 70% 55% at 22% 76%, rgba(196, 184, 162, 0.28) 0%, transparent 65%),
        radial-gradient(ellipse 60% 45% at 82% 88%, rgba(250, 245, 234, 0.5) 0%, transparent 60%),
        linear-gradient(to right, rgba(20, 18, 16, 0.022) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(20, 18, 16, 0.022) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 64px 64px, 64px 64px;
    }

    /* Deep matte charcoal torn-paper surface */
    .dark-paper-surface {
      background-color: var(--ink-deep);
      background-image:
        radial-gradient(ellipse 65% 55% at 20% 22%, rgba(237, 231, 218, 0.055) 0%, transparent 58%),
        radial-gradient(ellipse 60% 50% at 82% 78%, rgba(62, 92, 126, 0.09) 0%, transparent 60%),
        linear-gradient(180deg, rgba(20, 18, 16, 0.96) 0%, rgba(16, 15, 13, 1) 50%, rgba(18, 17, 15, 0.98) 100%);
    }

    /* Fine-grain archival paper & film noise overlay (vector turbulence, never pixelated) */
    .film-grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9000;
      opacity: 0.11;
      mix-blend-mode: multiply;
    }

    /* Wordmark styling */
    .wordmark-void {
      font-family: 'Pixelify Sans', monospace;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    .wordmark-luma {
      font-family: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.025em;
      color: var(--ink);
    }

    .reveal-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      padding-right: 0.08em;
    }

    /* Interactive hover glitch pulse on "Void" pixel wordmark */
    @keyframes voidGlitchShift {
      0% { transform: translate(0, 0) skewX(0deg); text-shadow: none; }
      20% { transform: translate(-2px, 1px) skewX(-4deg); text-shadow: 2px 0 rgba(62, 92, 126, 0.78), -2px 0 rgba(154, 51, 42, 0.68); }
      45% { transform: translate(2px, -1px) skewX(3deg); text-shadow: -2px 0 rgba(62, 92, 126, 0.7), 2px 0 rgba(20, 18, 16, 0.5); }
      75% { transform: translate(-1px, 0px) skewX(-1deg); text-shadow: 1px 0 rgba(62, 92, 126, 0.4); }
      100% { transform: translate(0, 0) skewX(0deg); text-shadow: none; }
    }
    .void-hover-interactive {
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .void-hover-interactive:hover {
      animation: voidGlitchShift 0.42s steps(3, end);
    }

    /* Arrow-shift button micro-interaction */
    .arrow-shift-icon {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .arrow-shift-trigger:hover .arrow-shift-icon {
      transform: translateX(4px);
    }

    /* Ink-fill hover button for CTA */
    .ink-fill-btn {
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: color 0.36s ease, border-color 0.36s ease, transform 0.3s ease;
    }
    .ink-fill-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background-color: #141210;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
    }
    .ink-fill-btn:hover {
      color: #EDE7DA;
      border-color: rgba(237, 231, 218, 0.65);
    }
    .ink-fill-btn:hover::before {
      transform: scaleX(1);
    }

    /* Polaroid hover pill wiggle */
    @keyframes pillWiggle {
      0%, 100% { transform: translateX(-50%) rotate(0deg); }
      25% { transform: translateX(-50%) rotate(-4deg); }
      65% { transform: translateX(-50%) rotate(3.5deg); }
    }
    .polaroid-group:hover .polaroid-pill {
      animation: pillWiggle 0.45s ease-in-out;
    }

    /* Vintage Collector Ticket Card (Trending Now) */
    .vintage-ticket-card {
      position: relative;
      background-color: #E7DEC9;
      background-image:
        radial-gradient(circle at 20% 15%, rgba(255, 252, 244, 0.58) 0%, transparent 55%),
        radial-gradient(circle at 80% 85%, rgba(164, 146, 118, 0.24) 0%, transparent 55%);
      color: #141210;
      clip-path: polygon(
        14px 0%, calc(50% - 10px) 0%, calc(50% - 8px) 7px, calc(50% + 8px) 7px, calc(50% + 10px) 0%,
        calc(100% - 14px) 0%, 100% 14px,
        100% calc(69% - 11px), calc(100% - 11px) 69%, 100% calc(69% + 11px),
        100% calc(100% - 14px), calc(100% - 14px) 100%,
        14px 100%, 0% calc(100% - 14px),
        0% calc(69% + 11px), 11px 69%, 0% calc(69% - 11px),
        0% 14px
      );
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s ease;
    }
    .vintage-ticket-wrap {
      filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.48));
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
    }
    .vintage-ticket-wrap:hover {
      transform: translateY(-10px) rotate(0deg) !important;
      filter: drop-shadow(0 24px 36px rgba(0, 0, 0, 0.68));
    }
    .vintage-ticket-vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.14em;
    }

    /* Ambient organic idle motion loops */
    @keyframes flowerSway {
      0%, 100% { transform: rotate(0deg) translateY(0px); }
      50% { transform: rotate(2.1deg) translateY(-4px); }
    }
    .flower-sway {
      animation: flowerSway 7.2s ease-in-out infinite;
      transform-origin: bottom center;
    }
    .flower-sway-slow {
      animation: flowerSway 9.4s ease-in-out infinite reverse;
      transform-origin: bottom center;
    }

    @keyframes birdGlide {
      0%, 100% { transform: translate(0px, 0px) rotate(-6deg); }
      50% { transform: translate(-8px, -10px) rotate(-2deg); }
    }
    .bird-glide {
      animation: birdGlide 7.8s ease-in-out infinite;
    }

    @keyframes butterflyFlutter {
      0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      50% { transform: translate(6px, -8px) scale(1.03) rotate(3deg); }
    }
    .butterfly-flutter {
      animation: butterflyFlutter 6.2s ease-in-out infinite;
    }

    @keyframes bookFloat {
      0%, 100% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-7px) rotate(-1.5deg); }
    }
    .book-float {
      animation: bookFloat 6.8s ease-in-out infinite;
    }

    @keyframes cassetteBob {

      50% { transform: translateY(-8px) rotate(-7deg); }
    }
    .cassette-float {

    @keyframes starSlowSpin {
      from { transform: rotate(0deg); }

    }

    @keyframes pixelFlicker {

            snap(item.y, start.y);
            snap(item.r, start.r);
            item.fresh = false;
          }
          let target;
          let omega = itemOmega;
          let damping = zeta;
          let lift = 0;

          if (state.focus === index) {
            target = { x: geometry.w / 2, y: focusY, z: 0, r: 0, ry: 0, s: focusScale };
            lift = 2.4;
            item.layer = 'focus';
          } else {
            const order = opening ? item.rank : item.rank;
            const delay = (order * 0.03) / s.speed;
            const active = elapsed >= delay ? phase : state.previous;
            target = place(item.rank, inside, active, s);
            if (active === 'open') {
              lift = hover === index ? 1 : 0.2;
            }
          }

          busy = integrate(item.x, target.x, omega, damping, dt) || busy;
          busy = integrate(item.y, target.y, omega, damping, dt) || busy;
          busy = integrate(item.z, target.z, itemOmega, zeta, dt) || busy;
          busy = integrate(item.r, target.r, omega, damping, dt) || busy;
          busy = integrate(item.s, target.s, itemOmega, zeta, dt) || busy;
          busy = integrate(item.hover, lift, itemOmega, zeta, dt) || busy;
        });

        write();
        if (busy) state.raf = requestAnimationFrame(frame);
        else state.last = 0;
      };

      const write = () => {
        const s = settingsRef.current;
        const { w, h, tabH, frontTop, frontH, docW, docH, scale, book: isBook } = s.g;
        const pivotX = w / 2;
        const pivotY = tabH + h / 2;
        const theta = state.front.value;
        const angle = (theta * Math.PI) / 180;
        const unfold = isBook ? clamp(-theta / 180, 0, 1) : 0;
        const shift = (w / 2) * unfold * (1 - state.anchor.value);
        const zoom = (1 + state.lift.value * 0.012) * state.squash.value;

        const desk = chain(
          move(pivotX, pivotY),
          turnX(state.rx.value),
          turnY(state.ry.value),
          stretch(zoom, zoom),
          move(-pivotX, -pivotY)
        );
        const folder = multiply(desk, move(shift, 0));
        const flipped = isBook && theta < -90;
        const frontZ = flipped ? '3' : '40';

        if (backRef.current) {
          backRef.current.style.transform = toCss(folder);
        }

        const frontMatrix = isBook
          ? chain(folder, move(0, frontTop, 2 * scale * (1 - unfold)), turnY(theta))
          : chain(folder, move(0, tabH + h, 2 * scale), turnX(theta), move(0, -frontH));

        const front = frontRef.current;
        if (front) {
          front.style.transform = toCss(frontMatrix);
          front.style.zIndex = frontZ;
        }

        if (groundRef.current) {
          groundRef.current.style.transform = toCss(multiply(folder, move(0, isBook ? tabH : tabH + h)));
        }

        state.items.forEach((item, index) => {
          const node = itemRefs.current[index];
          const z = 3 * scale + item.z.value + item.hover.value * 26 * scale;
          const matrix = chain(
            desk,
            move(item.x.value, item.y.value, z),
            turnZ(item.r.value),
            stretch(item.s.value, item.s.value),
            move(-docW / 2, -docH / 2)
          );
          let layer = 10 + s.count - item.rank;
          if (item.layer === 'focus') layer = LAYERS.focus;
          else if (state.phase === 'open' && state.hoveredItem === index) layer = 35;

          if (node) {
            node.style.transform = toCss(matrix);
            node.style.zIndex = String(layer);
            node.style.setProperty('--folder-lift', clamp(item.hover.value, 0, 2.4).toFixed(3));
          }
        });
      };

      const wake = () => {
        if (!state.raf) state.raf = requestAnimationFrame(frame);
      };

      engineRef.current = {
        wake,
        select: index => {
          const s = settingsRef.current;
          if (s.zoomOnClick) state.focus = state.focus === index ? -1 : index;
          s.onItemClick?.(s.entries[index], index);
          wake();
        }
      };

      const onPointerMove = event => {
        const box = root.getBoundingClientRect();
        state.pointerX = clamp(((event.clientX - box.left) / box.width) * 2 - 1, -1.5, 1.5);
        state.pointerY = clamp(((event.clientY - box.top) / box.height) * 2 - 1, -1.5, 1.5);
        const target = event.target.closest?.('[data-folder-item]');
        const index = target && root.contains(target) ? Number(target.getAttribute('data-folder-item')) : -1;
        state.hoveredItem = index;
        if (!state.hovered) {
          state.hovered = true;
          if (settingsRef.current.openOn === 'hover') setOpenRef.current(true);
        }
        wake();
      };

      const onPointerLeave = () => {
        state.hovered = false;
        state.pressed = false;
        state.hoveredItem = -1;
        if (settingsRef.current.openOn === 'hover') setOpenRef.current(false);
        wake();
      };

      root.addEventListener('pointermove', onPointerMove);
      root.addEventListener('pointerleave', onPointerLeave);
      wake();

      return () => {
        cancelAnimationFrame(state.raf);
        root.removeEventListener('pointermove', onPointerMove);
        root.removeEventListener('pointerleave', onPointerLeave);
        engineRef.current = null;
      };
    }, []);

    const toggle = () => {
      setOpen(!isOpen);
    };

    const vars = {
      '--folder-rgb': rgb.join(', '),
      '--folder-base': rgbString(rgb),
      '--folder-front-top': rgbString(mixRgb(rgb, [255, 255, 255], 0.12)),
      '--folder-front-bottom': rgbString(mixRgb(rgb, [0, 0, 0], 0.06)),
      '--folder-inside-top': insideTop,
      '--folder-inside-bottom': insideBottom,
      '--folder-tab-ink': luma(backTone) > 0.6 ? 'rgba(0, 0, 0, 0.72)' : 'rgba(255, 255, 255, 0.92)',
      '--folder-paper': rgbString(paper),
      '--folder-paper-ink': rgbString(mixRgb(paper, [0, 0, 0], 0.11)),
      '--folder-paper-ink-strong': rgbString(mixRgb(paper, [0, 0, 0], 0.28)),
      '--folder-paper-text': rgbString(mixRgb(paper, [0, 0, 0], 0.72)),
      '--folder-w': `${g.w}px`,
      '--folder-h': `${g.h}px`,
      '--folder-tab-h': `${g.tabH}px`,
      '--folder-front-y': `${g.frontTop}px`,
      '--folder-front-h': `${g.frontH}px`,
      '--folder-r': `${g.r}px`,
      '--folder-front-radius': book ? `0 ${g.r}px ${g.r}px 0` : `${g.r}px`,
      '--folder-doc-w': `${g.docW}px`,
      '--folder-doc-h': `${g.docH}px`,
      '--folder-depth': `${settingsRef.current ? settingsRef.current.depth : 1200}px`,
      '--folder-scale': scale,
      ...style
    };

    const shape = backPath(g);

    return (
      <div
        ref={rootRef}
        className={`folder-root${className ? ` ${className}` : ''}`}
        data-mode={book ? 'book' : 'flap'}
        data-variant={variant}
        data-theme={theme === 'light' ? 'light' : 'dark'}
        data-open={isOpen ? '' : undefined}
        style={vars}
      >
        <div
          className="folder-stage"
          role="button"
          tabIndex={0}
          aria-expanded={isOpen}
          onClick={toggle}
        >
          <span ref={groundRef} className="folder-layer folder-ground" aria-hidden="true" />
          {book && <span ref={castRef} className="folder-layer folder-cast" aria-hidden="true" />}

          <div ref={backRef} className="folder-layer folder-back" aria-hidden="true">
            <div className="folder-back-fill" style={{ clipPath: `path('${shape}')` }}>
              {book && <span className="folder-gutter" />}
            </div>
            {label && (
              <span className="folder-tab-text" style={{ left: g.tabX, width: g.tabW }}>
                {label}
              </span>
            )}
          </div>

          {entries.map((item, index) => {
            const shape = item?.shape || (item && typeof item === 'object' && item.shape) || undefined;
            return (
              <div
                key={index}
                ref={node => {
                  itemRefs.current[index] = node;
                }}
                className="folder-layer folder-item"
                data-folder-item={index}
                data-item-shape={shape}
                role="button"
                tabIndex={0}
                onClick={e => {
                  e.stopPropagation();
                  engineRef.current?.select(index);
                }}
              >
                {renderItem(item)}
              </div>
            );
          })}

          {book && <span ref={shadeRef} className="folder-layer folder-shade" aria-hidden="true" />}

          <div ref={frontRef} className="folder-layer folder-front" data-face="outer" aria-hidden="true">
            <div className="folder-face folder-face-outer" />
          </div>
        </div>

        {label && (
          <span ref={measureRef} className="folder-tab-text folder-measure" aria-hidden="true">
            {label}
          </span>
        )}
      </div>
    );
  }

  /* -------------------------------------------------------------------------
     Helper to safely normalize track details
     ------------------------------------------------------------------------- */
  function parseDurationStr(str) {
    if (!str) return 210;
    if (typeof str === 'number') return str;
    const parts = String(str).split(':');
    if (parts.length === 2) return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    return 210;
  }

  function normalizeTrackInfo(input) {
    if (!input) {
      return {
        title: 'Selected Music Disc',
        artist: 'VoidAntara',
        image: 'public/assets/download.jpg',
        duration: 30,
        startTime: 0,
        endTime: 30,
        audioUrl: '',
        serial: 'NO. 01',
        vibeTag: 'HI-FI',
        lyricSample: ''
      };
    }
    const t = input.track || input;
    const totalDur = typeof t.duration === 'string' ? parseDurationStr(t.duration) : (t.duration || 210);
    const dur = typeof input.duration === 'number' ? input.duration : Math.min(totalDur, 30);
    return {
      title: t.title || 'Selected Track',
      artist: t.artist || 'VoidAntara',
      image: t.image || 'public/assets/download.jpg',
      totalDuration: totalDur,
      duration: dur,
      startTime: input.startTime !== undefined ? input.startTime : 0,
      endTime: input.endTime !== undefined ? input.endTime : Math.min(totalDur, 30),
      audioUrl: t.audioUrl || '',
      serial: t.serial || 'NO. 01',
      vibeTag: t.vibeTag || 'HI-FI',
      lyricSample: t.lyricSample || ''
    };
  }

  /* -------------------------------------------------------------------------
     ProjectConfigModal Component
     Appears AFTER both Music and Template are selected.
     Allows trimming the audio (10s-45s) and choosing template color themes,
     then launching the Visualizer Studio.
     ------------------------------------------------------------------------- */
  function ProjectConfigModal({
    open,
    activeMusic,
    activeTemplate,
    onClose,
    onLaunch,
    ambientSynth
  }) {
    const musicInfo = normalizeTrackInfo(activeMusic);
    const tplName = activeTemplate?.name || activeTemplate?.title || 'Liquid Glass Center';
    const tplImage = activeTemplate?.image || 'public/assets/download (1).jpg';
    const totalDuration = musicInfo.totalDuration || 210;

    const [startTime, setStartTime] = useState(musicInfo.startTime || 0);
    const [endTime, setEndTime] = useState(musicInfo.endTime || Math.min(totalDuration, 30));
    const [selectedTheme, setSelectedTheme] = useState(() => {
      try {
        const saved = localStorage.getItem('void_project_template');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.theme) return parsed.theme;
        }
      } catch(e) {}
      return activeTemplate?.theme || 'crimson';
    });

    const [isPlaying, setIsPlaying] = useState(false);
    const audioRef = useRef(null);
    const timerRef = useRef(null);

    const stopAudio = useCallback(() => {
      if (timerRef.current) {
        clearTimeout(timerRef.current);
        timerRef.current = null;
      }
      if (audioRef.current) {
        audioRef.current.pause();
        audioRef.current.currentTime = startTime;
      }
      if (ambientSynth) ambientSynth.stop();
      setIsPlaying(false);
    }, [ambientSynth, startTime]);

    useEffect(() => {
      if (open && activeMusic) {
        const info = normalizeTrackInfo(activeMusic);
        const tot = info.totalDuration || 210;
        setStartTime(info.startTime || 0);
        setEndTime(info.endTime || Math.min(tot, 30));
        if (activeTemplate?.theme) setSelectedTheme(activeTemplate.theme);
      } else {
        stopAudio();
      }
    }, [open, activeMusic, activeTemplate]);

    useEffect(() => {
      return () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (audioRef.current) audioRef.current.pause();
        if (ambientSynth) ambientSynth.stop();
      };
    }, [ambientSynth]);

    // 32-bar visualizer waveform
    const barsCount = 32;
    const waveBars = useMemo(() => {
      const bars = [];
      for (let i = 0; i < barsCount; i++) {
        const heightPercent = 22 + Math.sin(i * 0.45) * 48 + ((i % 3) * 14);
        const barSec = (i / barsCount) * totalDuration;
        const isSelected = barSec >= startTime && barSec <= endTime;
        bars.push({ heightPercent, isSelected });
      }
      return bars;
    }, [barsCount, totalDuration, startTime, endTime]);

    if (!open || !activeMusic) return null;

    const MIN_LEN = 10;
    const MAX_LEN = 45;
    const duration = Math.max(MIN_LEN, Math.min(MAX_LEN, endTime - startTime));

    const formatTime = (secs) => {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    };

    const handleStartChange = (val) => {
      const s = Math.max(0, Math.min(totalDuration - MIN_LEN, val));
      setStartTime(s);
      if (endTime - s < MIN_LEN) {
        setEndTime(Math.min(totalDuration, s + MIN_LEN));
      } else if (endTime - s > MAX_LEN) {
        setEndTime(s + MAX_LEN);
      }
    };

    const handleEndChange = (val) => {
      const e = Math.min(totalDuration, Math.max(MIN_LEN, val));
      setEndTime(e);
      if (e - startTime < MIN_LEN) {
        setStartTime(Math.max(0, e - MIN_LEN));
      } else if (e - startTime > MAX_LEN) {
        setStartTime(Math.max(0, e - MAX_LEN));
      }
    };

    const handlePreset = (len, startOffset = 0) => {
      const s = Math.min(totalDuration - len, startOffset);
      const e = s + len;
      setStartTime(s);
      setEndTime(e);
    };

    const toggleAudition = () => {
      if (isPlaying) {
        stopAudio();
      } else {
        setIsPlaying(true);
        if (musicInfo.audioUrl && audioRef.current) {
          audioRef.current.currentTime = startTime;
          audioRef.current.play().catch(() => {});
        } else if (ambientSynth) {
          ambientSynth.start(activeMusic.track || activeMusic);
        }

        const ms = (endTime - startTime) * 1000;
        timerRef.current = setTimeout(() => {
          stopAudio();
        }, ms);
      }
    };

    const themeOptions = [
      { id: 'crimson', name: 'Crimson Ink', color: '#9A332A', border: '#9A332A' },
      { id: 'obsidian', name: 'Obsidian Gold', color: '#f59e0b', border: '#f59e0b' },
      { id: 'violet', name: 'Midnight Violet', color: '#8b5cf6', border: '#8b5cf6' },
      { id: 'arctic', name: 'Arctic Mist', color: '#0284c7', border: '#0284c7' },
      { id: 'emerald', name: 'Emerald Velvet', color: '#10b981', border: '#10b981' }
    ];

    const handleConfirmAndLaunch = () => {
      stopAudio();
      const updatedMusic = {
        track: activeMusic.track || activeMusic,
        startTime,
        endTime,
        duration: endTime - startTime
      };
      const updatedTemplate = {
        ...(activeTemplate || {}),
        theme: selectedTheme
      };

      try {
        localStorage.setItem('void_project_music', JSON.stringify(updatedMusic));
        localStorage.setItem('void_project_template', JSON.stringify(updatedTemplate));
      } catch(e) {}

      if (onLaunch) {
        onLaunch(updatedMusic, updatedTemplate);
      } else {
        const dest = updatedTemplate.templateFile || 'template/Liquid_glass_center.html';
        window.location.href = dest;
      }
    };

    return (
      <div
        data-dark-section="true"
        className="fixed inset-0 z-[360] bg-[#12110F]/85 backdrop-blur-md flex items-center justify-center p-4 select-none overflow-y-auto"
        onClick={() => { stopAudio(); onClose(); }}
      >
        <div
          className="w-full max-w-2xl rounded-2xl bg-[#181715] text-[#EDE7DA] border border-[#EDE7DA]/25 shadow-2xl p-6 sm:p-7 space-y-6 relative my-auto"
          onClick={e => e.stopPropagation()}
        >
          {musicInfo.audioUrl && (
            <audio ref={audioRef} src={musicInfo.audioUrl} preload="auto" />
          )}

          {/* Close button */}
          <button
            type="button"
            onClick={() => { stopAudio(); onClose(); }}
            className="absolute top-5 right-5 w-8 h-8 rounded-full border border-[#EDE7DA]/25 text-[#EDE7DA] hover:bg-[#EDE7DA] hover:text-[#141210] flex items-center justify-center font-mono text-sm transition-colors cursor-pointer"
            aria-label="Close setup modal"
          >
            ✕
          </button>

          {/* Header with Music & Template Side-by-Side */}
          <div className="border-b border-[#EDE7DA]/15 pb-4 pr-8">
            <span className="font-mono text-[10px] tracking-widest uppercase px-2 py-0.5 rounded bg-[#9A332A] text-white font-bold inline-block mb-2">
              PROJECT STUDIO SETUP
            </span>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
              {/* Music Card Mini */}
              <div className="flex items-center gap-3 p-2.5 rounded-xl bg-[#EDE7DA]/8 border border-[#EDE7DA]/15">
                <div
                  className="w-12 h-12 rounded-full relative shrink-0 flex items-center justify-center shadow-md"
                  style={{
                    background: 'radial-gradient(circle, #2d2a27 0%, #151412 50%, #080706 100%)',
                    boxShadow: 'inset 0 0 0 1.5px rgba(237,231,218,0.3)'
                  }}
                >
                  <img
                    src={musicInfo.image}
                    alt={musicInfo.title}
                    className="w-5 h-5 rounded-full object-cover border border-[#141210]"
                    onError={e => { e.currentTarget.style.display = 'none'; }}
                  />
                  <div className="w-1.5 h-1.5 rounded-full bg-[#181715] absolute border border-[#EDE7DA]/70" />
                </div>
                <div className="min-w-0">
                  <span className="block font-mono text-[9px] uppercase tracking-wider text-[#EDE7DA]/55">Music Track</span>
                  <p className="font-mono text-xs font-bold text-white truncate">{musicInfo.title}</p>
                  <p className="font-mono text-[10px] text-[#EDE7DA]/70 truncate">{musicInfo.artist}</p>
                </div>
              </div>

              {/* Template Card Mini */}
              <div className="flex items-center gap-3 p-2.5 rounded-xl bg-[#EDE7DA]/8 border border-[#EDE7DA]/15">
                <img
                  src={tplImage}
                  alt={tplName}
                  className="w-12 h-12 rounded-lg object-cover border border-[#EDE7DA]/20 shrink-0 shadow-md"
                  onError={e => { e.currentTarget.src = 'public/assets/download (1).jpg'; }}
                />
                <div className="min-w-0">
                  <span className="block font-mono text-[9px] uppercase tracking-wider text-[#EDE7DA]/55">Visual Template</span>
                  <p className="font-mono text-xs font-bold text-white truncate">{tplName}</p>
                  <span className="font-mono text-[10px] text-[#9A332A] font-bold">Liquid Glass Synced</span>
                </div>
              </div>
            </div>
          </div>

          {/* 1. MUSIC TIMING TRIMMER SECTION */}
          <div className="space-y-3.5">
            <div className="flex items-center justify-between">
              <span className="font-mono text-xs uppercase tracking-wider font-bold text-[#EDE7DA]">
                1. Music Timing Snippet
              </span>
              <span className="font-mono text-[11px] text-[#EDE7DA]/60">
                Min <strong>10s</strong> &bull; Max <strong>45s</strong>
              </span>
            </div>

            {/* Time Indicators */}
            <div className="grid grid-cols-3 gap-2.5 text-center">
              <div className="p-2 rounded-xl bg-[#EDE7DA]/8 border border-[#EDE7DA]/15">
                <span className="block font-mono text-[9px] text-[#EDE7DA]/55 uppercase">Start</span>
                <span className="font-mono text-sm font-bold text-[#EDE7DA]">{formatTime(startTime)}</span>
              </div>
              <div className="p-2 rounded-xl bg-[#9A332A]/25 border border-[#9A332A]/40 text-[#EDE7DA]">
                <span className="block font-mono text-[9px] text-[#EDE7DA]/75 uppercase">Snippet Duration</span>
                <span className="font-mono text-sm font-bold text-white">{duration}s</span>
              </div>
              <div className="p-2 rounded-xl bg-[#EDE7DA]/8 border border-[#EDE7DA]/15">
                <span className="block font-mono text-[9px] text-[#EDE7DA]/55 uppercase">End</span>
                <span className="font-mono text-sm font-bold text-[#EDE7DA]">{formatTime(endTime)}</span>
              </div>
            </div>

            {/* Waveform Visualization */}
            <div className="h-12 rounded-xl bg-[#141210] border border-[#EDE7DA]/20 p-2 flex items-end justify-between gap-1 overflow-hidden">
              {waveBars.map((bar, i) => (
                <div
                  key={i}
                  className={`w-full rounded-full transition-all duration-300 ${
                    bar.isSelected
                      ? 'bg-gradient-to-t from-[#9A332A] to-[#EDE7DA] opacity-95 shadow-sm'
                      : 'bg-[#EDE7DA] opacity-20'
                  }`}
                  style={{ height: `${bar.heightPercent}%` }}
                />
              ))}
            </div>

            {/* Sliders */}
            <div className="space-y-2 pt-1">
              <div>
                <div className="flex justify-between font-mono text-[10px] text-[#EDE7DA]/70 mb-0.5">
                  <span>Start Position: {formatTime(startTime)}</span>
                  <span>Drag to reposition</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max={totalDuration - MIN_LEN}
                  value={startTime}
                  onChange={e => handleStartChange(parseInt(e.target.value, 10))}
                  className="w-full accent-[#EDE7DA] cursor-pointer"
                />
              </div>

              <div>
                <div className="flex justify-between font-mono text-[10px] text-[#EDE7DA]/70 mb-0.5">
                  <span>End Position: {formatTime(endTime)}</span>
                  <span>(Snippet: {duration}s)</span>
                </div>
                <input
                  type="range"
                  min={startTime + MIN_LEN}
                  max={Math.min(totalDuration, startTime + MAX_LEN)}
                  value={endTime}
                  onChange={e => handleEndChange(parseInt(e.target.value, 10))}
                  className="w-full accent-[#9A332A] cursor-pointer"
                />
              </div>
            </div>

            {/* Presets & Audition Button */}
            <div className="flex flex-wrap items-center justify-between gap-2 pt-1 font-mono text-xs">
              <div className="flex items-center gap-1.5">
                <span className="text-[#EDE7DA]/50 text-[10px]">Presets:</span>
                <button
                  type="button"
                  onClick={() => handlePreset(15, 0)}
                  className="px-2 py-0.5 rounded bg-[#EDE7DA]/10 hover:bg-[#EDE7DA]/25 border border-[#EDE7DA]/15 text-[10px] transition-colors cursor-pointer"
                >
                  15s
                </button>
                <button
                  type="button"
                  onClick={() => handlePreset(30, 15)}
                  className="px-2 py-0.5 rounded bg-[#EDE7DA]/10 hover:bg-[#EDE7DA]/25 border border-[#EDE7DA]/15 text-[10px] transition-colors cursor-pointer"
                >
                  30s
                </button>
                <button
                  type="button"
                  onClick={() => handlePreset(45, 20)}
                  className="px-2 py-0.5 rounded bg-[#EDE7DA]/10 hover:bg-[#EDE7DA]/25 border border-[#EDE7DA]/15 text-[10px] transition-colors cursor-pointer"
                >
                  45s
                </button>
              </div>

              <button

            goalR = s.matchRadius ? Math.min(targetRadius + Math.max(0, s.padding), s.cornerSize) : 0;
          }

          if (!pointer.inside && presence.x < 0.01) pointer.seen = false;
          if (!pointer.seen) {
            centerX.x = goalX;
            centerY.x = goalY;
            halfW.x = goalW;
            halfH.x = goalH;
            pointer.seen = pointer.inside;
          }

          const follow = locked ? snapK : 2200;
          const followC = locked ? snapC : 2 * Math.sqrt(2200);
          spring(centerX, goalX, follow, followC, dt);
          spring(centerY, goalY, follow, followC, dt);
          spring(halfW, goalW, snapK, snapC, dt);
          spring(halfH, goalH, snapK, snapC, dt);
          spring(radius, goalR, snapK, 2 * snapW, dt);

          if (locked) {
            spring(turn, quarter * QUARTER, snapK, snapC, dt);
          } else {
            const speed = s.spinDuration > 0 && !reduce ? (Math.PI * 2) / s.spinDuration : 0;
            spinSpeed += (speed - spinSpeed) * (1 - Math.exp(-dt * 3));
            turn.v = spinSpeed;
            turn.x += spinSpeed * dt;
          }

          const squeeze = 1 - press.x * 0.14;
          const cos = Math.cos(turn.x);
          const sin = Math.sin(turn.x);
          const w = Math.max(0, halfW.x) * squeeze;
          const h = Math.max(0, halfH.x) * squeeze;
          const local = [
            [-w, -h],
            [w, -h],
            [w, h],
            [-w, h]
          ];
          const r = Math.max(0, Math.min(radius.x, s.cornerSize));
          const degrees = (turn.x * 180) / Math.PI;
          let left = Infinity;
          let top = Infinity;
          const sizeChanged = s.cornerSize !== lastCornerSize || s.thickness !== lastThickness;
          if (sizeChanged) {
            lastCornerSize = s.cornerSize;
            lastThickness = s.thickness;
          }
          cornerRefs.current.forEach((corner, i) => {
            if (!corner) return;
            const [lx, ly] = local[i];
            const x = centerX.x + lx * cos - ly * sin;
            const y = centerY.x + lx * sin + ly * cos;
            left = Math.min(left, x);
            top = Math.min(top, y);
            corner.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${(CORNER_ANGLES[i] + degrees).toFixed(2)}deg)`;
            if (sizeChanged) {
              corner.style.width = `${s.cornerSize}px`;
              corner.style.height = `${s.cornerSize}px`;
              corner.style.borderWidth = `${s.thickness}px 0 0 ${s.thickness}px`;
            }
            corner.style.borderTopLeftRadius = `${r.toFixed(2)}px`;
          });

          const dot = dotRef.current;
          if (dot) {
            const dotScale = 1 - press.x * 0.35;
            dot.style.transform = `translate3d(${pointer.x}px, ${pointer.y}px, 0) translate(-50%, -50%) scale(${dotScale.toFixed(3)})`;
            dot.style.width = `${s.dotSize}px`;
            dot.style.height = `${s.dotSize}px`;
          }

          const label = labelRef.current;
          if (label) {
            const text = s.showLabel && target ? target.getAttribute('data-cursor-label') || '' : '';
            if (text && text !== lastLabel) label.textContent = text;
            if (text) lastLabel = text;
            const shown = text ? Math.max(0, Math.min(1, lock.x)) : 0;
            label.style.transform = `translate3d(${left.toFixed(2)}px, ${(top - 8).toFixed(2)}px, 0) translateY(-100%) translateY(${((1 - shown) * 4).toFixed(2)}px)`;
            label.style.opacity = shown.toFixed(3);
          }

          const mix = s.cursorColorOnTarget ? Math.round(Math.max(0, Math.min(1, lock.x)) * 100) : 0;
          const color = mix ? `color-mix(in oklab, ${s.cursorColorOnTarget} ${mix}%, ${s.cursorColor})` : s.cursorColor;
          if (color !== lastColor) {
            root.style.setProperty('--target-cursor-color', color);
            lastColor = color;
          }
          root.style.opacity = Math.max(0, Math.min(1, presence.x)).toFixed(3);

          const resting =
            !pointer.inside &&
            presence.x < 0.002 &&
            Math.abs(presence.v) < 0.002 &&
            Math.abs(lock.x) < 0.002 &&
            Math.abs(press.x) < 0.002;
          const spinning = pointer.inside && !locked && spinSpeed > 0.0001;
          const moving =
            Math.abs(centerX.v) + Math.abs(centerY.v) + Math.abs(halfW.v) + Math.abs(halfH.v) + Math.abs(turn.v) > 0.01 ||
            Math.abs(goalX - centerX.x) + Math.abs(goalY - centerY.x) > 0.05 ||
            Math.abs(lock.v) + Math.abs(press.v) + Math.abs(presence.v) > 0.001;
          if (!resting && (spinning || moving || locked)) raf = requestAnimationFrame(frame);
          else last = 0;
        };

        const wake = () => {
          if (!raf) raf = requestAnimationFrame(frame);
        };
        wakeRef.current = () => {
          hideCursor();
          wake();
        };

        const insideScope = (x, y, element) => {
          const scope = scopeOf();
          if (!scope) return true;
          if (element && scope.contains(element)) return true;
          const box = scope.getBoundingClientRect();
          return x >= box.left && x <= box.right && y >= box.top && y <= box.bottom;
        };

        const onPointerMove = event => {
          if (event.pointerType && event.pointerType !== 'mouse') return;
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          const evTarget = event.target;
          const inside = insideScope(pointer.x, pointer.y, evTarget);
          if (inside !== pointer.inside) {
            pointer.inside = inside;
            hideCursor();
            lastMoveTarget = null;
          }
          if (!inside) {
            lockOn(null);
            lastMoveTarget = null;
          } else if (evTarget !== lastMoveTarget) {
            lastMoveTarget = evTarget;
            lockOn(findTarget(pointer.x, pointer.y, evTarget));
          }
          wake();
        };

        const onPointerDown = event => {
          if (event.pointerType && event.pointerType !== 'mouse') return;
          pointer.pressed = true;
          wake();
        };

        const onPointerUp = () => {
          pointer.pressed = false;
          wake();
        };

        const onLeave = () => {
          pointer.inside = false;
          pointer.pressed = false;
          lastMoveTarget = null;
          lockOn(null);
          hideCursor();
          wake();
        };

        const onScroll = () => {
          if (!pointer.inside || scrollRaf) return;
          scrollRaf = requestAnimationFrame(() => {
            scrollRaf = 0;
            if (!pointer.inside) return;
            lastMoveTarget = null;
            lockOn(findTarget(pointer.x, pointer.y));
            wake();
          });
        };

        window.addEventListener('pointermove', onPointerMove, { passive: true });
        window.addEventListener('pointerdown', onPointerDown, { passive: true });
        window.addEventListener('pointerup', onPointerUp, { passive: true });
        window.addEventListener('scroll', onScroll, { passive: true, capture: true });
        document.documentElement.addEventListener('pointerleave', onLeave);
        window.addEventListener('blur', onLeave);

        return () => {
          cancelAnimationFrame(raf);
          if (scrollRaf) cancelAnimationFrame(scrollRaf);
          wakeRef.current = null;
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerdown', onPointerDown);
          window.removeEventListener('pointerup', onPointerUp);
          window.removeEventListener('scroll', onScroll, { capture: true });
          document.documentElement.removeEventListener('pointerleave', onLeave);
          window.removeEventListener('blur', onLeave);
          lastScope?.removeAttribute('data-target-cursor-scope');
          style.remove();
        };
      }, [host]);

      useEffect(() => {
        wakeRef.current?.();
      });

      if (!host) return null;

      return ReactDOM.createPortal(
        <div ref={rootRef} className="target-cursor" style={{ mixBlendMode: blendMode, opacity: 0 }} aria-hidden="true">
          {CORNER_ANGLES.map((angle, i) => (
            <span
              key={angle}
              ref={element => {
                cornerRefs.current[i] = element;
              }}
              className="target-cursor__corner"
            />
          ))}
          <span ref={dotRef} className="target-cursor__dot" />
          <span ref={labelRef} className="target-cursor__label" />
        </div>,
        host
      );
    }

    /* =========================================================================
       REACT BITS: TiltedCard Component
       ========================================================================= */
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    const parseColor = value => {
      const text = String(value || '').trim();
      const hex = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(text);
      if (hex) {
        const full = hex[1].length === 3 ? hex[1].replace(/./g, digit => digit + digit) : hex[1];
        return [0, 2, 4].map(index => parseInt(full.slice(index, index + 2), 16));
      }
      const rgb = /^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(text);
      if (rgb) return [rgb[1], rgb[2], rgb[3]].map(channel => clamp(Math.round(parseFloat(channel)), 0, 255));
      return null;
    };

    const toLength = value => (typeof value === 'number' ? `${value}px` : value);

    const smoother = t => {
      const x = clamp(t, 0, 1);
      return x * x * x * (x * (x * 6 - 15) + 10);
    };

    const stepPhysics = (state, key, target, omega, zeta, dt) => {
      const velocity = `v${key}`;
      const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
      const h = dt / steps;
      for (let index = 0; index < steps; index++) {
        state[velocity] += (omega * omega * (target - state[key]) - 2 * zeta * omega * state[velocity]) * h;
        state[key] += state[velocity] * h;
      }
      const settled = Math.abs(target - state[key]) < 0.001 && Math.abs(state[velocity]) < 0.01;
      if (settled) {
        state[key] = target;
        state[velocity] = 0;
      }
      return !settled;
    };

    function TiltedCardLayer({ depth = 20, className = '', style, children }) {
      return (
        <div className={`tilted-card__layer ${className}`.trim()} style={{ '--tc-depth': depth, ...style }}>
          {children}
        </div>
      );
    }

    function TiltedCard({
      imageSrc,
      altText = 'Tilted card image',
      captionText = '',
      containerHeight = '300px',
      containerWidth = '100%',
      imageHeight = '300px',
      imageWidth = '100%',
      scaleOnHover = 1.04,
      rotateAmplitude = 12,
      showTooltip = true,
      overlayContent = null,
      displayOverlayContent = false,
      overlayDepth = 30,
      children,
      backContent = null,
      flipOnClick = true,
      flipped,
      onFlip,
      radius = 16,
      perspective = 800,
      smoothness = 0.6,
      glare = 0.45,
      glareColor = '#ffffff',
      shadow = 0.5,
      parallax = 1,
      axis = 'both',
      reverse = false,
      trackWindow = false,
      floating = false,
      gyroscope = true,
      intro = true,
      introDelay = 0,
      onClick,
      className = '',
      style
    }) {
      const figureRef = useRef(null);
      const bodyRef = useRef(null);
      const shadowRef = useRef(null);
      const captionRef = useRef(null);
      const wakeRef = useRef(null);
      const flipRef = useRef(null);
      const [innerFlipped, setInnerFlipped] = useState(false);
      const controlled = typeof flipped === 'boolean';
      const isFlipped = Boolean(backContent) && (controlled ? flipped : innerFlipped);

      const settings = {
        amplitude: clamp(rotateAmplitude, 0, 60),
        scale: Math.max(0.5, scaleOnHover),
        smoothness: clamp(smoothness, 0, 1),
        glare: clamp(glare, 0, 1),
        shadow: clamp(shadow, 0, 1),
        parallax: Math.max(0, parallax),
        axis,
        reverse,
        trackWindow,
        floating,
        gyroscope,
        intro,
        introDelay: Math.max(0, introDelay),
        flippable: Boolean(backContent) && flipOnClick,
        interactive: (Boolean(backContent) && flipOnClick) || Boolean(onClick),
        flipped: isFlipped,
        tooltip: showTooltip && Boolean(captionText)
      };
      const settingsRef = useRef(settings);
      settingsRef.current = settings;

      useEffect(() => {
        wakeRef.current?.();
      });

      useEffect(() => {
        const figure = figureRef.current;
        const body = bodyRef.current;
        if (!figure || !body) return;

        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const coarse = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        const state = {
          rx: 0, vrx: 0, ry: 0, vry: 0, lift: 0, vlift: 0,
          ty: 0, vty: 0, flip: 0, vflip: 0, press: 0, vpress: 0,
          tip: 0, vtip: 0, shown: 0, vshown: 0, tx: 0, tyy: 0
        };
        const pointer = { nx: 0, ny: 0, x: 0, y: 0, inside: false, mouse: false, seen: false, vx: 0, last: 0 };
        const press = { active: false, x: 0, y: 0, moved: false };
        const tilt = { gamma: 0, beta: 0, baseGamma: 0, baseBeta: 0, calibrated: false, live: false, asked: false };
        let opacity = 1;
        let entered = true;
        let introAt = -1;
        let time = Math.random() * 10;
        let focused = false;
        let raf = 0;
        let last = 0;
        let visible = true;

        if (settingsRef.current.intro && !reduced) {
          entered = false;
          opacity = 0;
          state.rx = 16;
          state.ty = 22;
          body.style.opacity = '0';
        }

        const frame = now => {
          raf = 0;
          const s = settingsRef.current;
          const dt = clamp((now - last) / 1000 || 0, 0, 0.05);
          last = Math.max(last, now);
          time += dt;
          let busy = false;

          const amplitude = s.amplitude * (reduced ? 0.3 : 1);
          const hovering = pointer.inside && pointer.mouse;
          const touching = press.active && !pointer.mouse;
          const following = hovering || touching || (s.trackWindow && pointer.seen && !coarse);
          let inputX = 0;
          let inputY = 0;
          if (following) {
            inputX = pointer.nx;
            inputY = pointer.ny;
          } else if (tilt.live && s.gyroscope) {
            inputX = clamp((tilt.gamma - tilt.baseGamma) / 22, -1, 1);
            inputY = clamp((tilt.beta - tilt.baseBeta) / 22, -1, 1);
            tilt.baseGamma += (tilt.gamma - tilt.baseGamma) * (1 - Math.exp(-dt / 4));
            tilt.baseBeta += (tilt.beta - tilt.baseBeta) * (1 - Math.exp(-dt / 4));
            busy = true;
          } else if (s.floating && !reduced && visible) {
            inputX = 0.32 * Math.sin(time * 0.62) + 0.12 * Math.sin(time * 1.31 + 0.7);
            inputY = 0.26 * Math.sin(time * 0.83 + 1.9) + 0.1 * Math.sin(time * 1.57);
            busy = true;
          }
          if (s.axis === 'horizontal') inputY = 0;
          if (s.axis === 'vertical') inputX = 0;
          const sign = s.reverse ? -1 : 1;

          const omega = 20 * Math.pow(0.2, s.smoothness);
          const zeta = 1 - 0.3 * s.smoothness;
          const lifted = hovering || touching || focused ? 1 : 0;

          if (!entered && introAt >= 0 && now >= introAt) entered = true;
          const settle = entered || !s.intro || reduced;
          busy = stepPhysics(state, 'rx', settle ? -inputY * amplitude * sign : state.rx, omega, zeta, dt) || busy;
          busy = stepPhysics(state, 'ry', settle ? inputX * amplitude * sign : state.ry, omega, zeta, dt) || busy;
          busy = stepPhysics(
            state, 'ty',
            settle ? (s.floating && !following && !reduced ? -4 * Math.sin(time * 0.9) : 0) : state.ty,
            omega * 0.8, 0.9, dt
          ) || busy;
          busy = stepPhysics(state, 'lift', lifted, omega, Math.max(zeta, 0.85), dt) || busy;
          busy = stepPhysics(state, 'flip', s.flipped ? 180 : 0, reduced ? 18 : 9.5, 0.72, dt) || busy;
          busy = stepPhysics(state, 'press', press.active && !press.moved && s.interactive ? 1 : 0, 26, 0.8, dt) || busy;
          if (settle && opacity < 1) {
            opacity = Math.min(1, opacity + dt / 0.45);
            busy = true;
          }

          const active = lifted > 0 || state.lift > 0.01;
          if (active !== figure.hasAttribute('data-active')) figure.toggleAttribute('data-active', active);
          const scale = 1 + (s.scale - 1) * state.lift - 0.02 * state.press;
          const rx = state.rx;
          const ry = state.ry;
          const radiansX = (rx * Math.PI) / 180;
          const radiansY = (ry * Math.PI) / 180;
          body.style.transform = `translate3d(0, ${state.ty.toFixed(2)}px, 0) rotateX(${rx.toFixed(3)}deg) rotateY(${(ry + state.flip).toFixed(3)}deg) scale(${scale.toFixed(4)})`;
          body.style.opacity = opacity < 1 ? smoother(opacity).toFixed(3) : '';
          body.style.setProperty('--tc-px', (Math.sin(radiansY) * s.parallax).toFixed(4));
          body.style.setProperty('--tc-py', (-Math.sin(radiansX) * s.parallax).toFixed(4));
          const reach = Math.max(amplitude, 1);
          body.style.setProperty('--tc-gx', `${(50 + (ry / reach) * 46).toFixed(2)}%`);
          body.style.setProperty('--tc-gy', `${(50 - (rx / reach) * 46).toFixed(2)}%`);
          const energy = Math.min(1, Math.hypot(rx, ry) / reach);
          body.style.setProperty(
            '--tc-glare',
            (s.glare * Math.max(state.lift, energy) * (opacity < 1 ? smoother(opacity) : 1)).toFixed(3)
          );

          const shade = shadowRef.current;
          if (shade) {
            const strength = s.shadow * (opacity < 1 ? smoother(opacity) : 1);
            const offsetX = -Math.sin(radiansY) * 22;
            const offsetY = 12 + 16 * state.lift + Math.sin(radiansX) * 18 - state.ty * 0.6;
            const turn = Math.abs(Math.cos((state.flip * Math.PI) / 180));
            const spread = scale * (0.86 + 0.04 * state.lift);
            shade.style.transform = `translate3d(${offsetX.toFixed(2)}px, ${offsetY.toFixed(2)}px, 0) scale(${(spread * (0.2 + 0.8 * turn)).toFixed(4)}, ${spread.toFixed(4)})`;
            shade.style.opacity = (strength * (0.6 + 0.4 * state.lift)).toFixed(3);
          }

          const caption = captionRef.current;
          if (caption) {
            const show = s.tooltip && hovering ? 1 : 0;
            busy = stepPhysics(state, 'shown', show, 16, 1, dt) || busy;
            const follow = 1 - Math.exp(-dt / 0.035);
            state.tx += (pointer.x - state.tx) * follow;
            state.tyy += (pointer.y - state.tyy) * follow;
            if (Math.abs(pointer.x - state.tx) + Math.abs(pointer.y - state.tyy) > 0.2) busy = true;
            pointer.vx *= Math.exp(-dt / 0.08);
            busy = stepPhysics(state, 'tip', reduced ? 0 : clamp(-pointer.vx * 0.012, -14, 14), 18, 0.62, dt) || busy;
            caption.style.transform = `translate3d(${state.tx.toFixed(1)}px, ${state.tyy.toFixed(1)}px, 0) rotate(${state.tip.toFixed(2)}deg)`;
            caption.style.opacity = Math.max(0, state.shown).toFixed(3);
          }

          if ((busy || (!settle && s.intro)) && visible) raf = requestAnimationFrame(frame);
        };

        const wake = () => {
          if (raf || !visible) return;
          last = performance.now();
          raf = requestAnimationFrame(frame);
        };
        wakeRef.current = wake;

        const locate = (event, area) => {
          const rect = area.getBoundingClientRect();
          return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top,
            width: Math.max(1, rect.width),
            height: Math.max(1, rect.height)
          };
        };

        const track = event => {
          const spot = locate(event, figure);
          const now = performance.now();
          const elapsed = Math.max(8, now - (pointer.last || now - 16)) / 1000;
          const dx = spot.x - pointer.x;
          pointer.vx += (dx / elapsed - pointer.vx) * 0.5;
          pointer.last = now;
          pointer.x = spot.x;
          pointer.y = spot.y;
          pointer.nx = clamp((spot.x - spot.width / 2) / (spot.width / 2), -1, 1);
          pointer.ny = clamp((spot.y - spot.height / 2) / (spot.height / 2), -1, 1);
        };

        const onEnter = event => {
          pointer.inside = true;
          pointer.mouse = event.pointerType === 'mouse' || event.pointerType === 'pen';
          const spot = locate(event, figure);
          pointer.x = spot.x;
          pointer.y = spot.y;
          state.tx = spot.x;
          state.tyy = spot.y;
          pointer.vx = 0;
          track(event);
          wake();
        };

        const onMove = event => {
          pointer.mouse = event.pointerType === 'mouse' || event.pointerType === 'pen';
          if (!pointer.inside && pointer.mouse) {
            pointer.inside = true;
            const spot = locate(event, figure);
            pointer.x = spot.x;
            pointer.y = spot.y;
            state.tx = spot.x;
            state.tyy = spot.y;
            pointer.vx = 0;
          }
          track(event);
          wake();
        };

        const onLeave = () => {
          pointer.inside = false;
          pointer.vx = 0;
          wake();
        };

        figure.addEventListener('pointerenter', onEnter);
        figure.addEventListener('pointermove', onMove);
        figure.addEventListener('pointerleave', onLeave);

        const observer = new IntersectionObserver(entries => {
          visible = entries.some(entry => entry.isIntersecting);
          if (visible && !entered && introAt < 0) introAt = performance.now() + settingsRef.current.introDelay;
          wake();
        });
        observer.observe(figure);
        wake();

        return () => {
          cancelAnimationFrame(raf);
          observer.disconnect();
          figure.removeEventListener('pointerenter', onEnter);
          figure.removeEventListener('pointermove', onMove);
          figure.removeEventListener('pointerleave', onLeave);
        };
      }, []);

      const flippable = Boolean(backContent) && flipOnClick;
      const interactive = flippable || Boolean(onClick);

      const toggle = (e) => {
        if (e && e.target && e.target.closest && e.target.closest('button, a, input, [role="button"]')) return;
        const next = !isFlipped;
        if (!controlled) setInnerFlipped(next);
        onFlip?.(next);
      };

      const corner = toLength(radius);
      const glareRgb = (parseColor(glareColor) || [255, 255, 255]).join(', ');
      const bleed = Math.ceil(Math.sin((clamp(rotateAmplitude, 0, 60) * Math.PI) / 180) * 24 * Math.max(0, parallax)) + 1;

      return (
        <figure
          ref={figureRef}
          className={`tilted-card ${className}`.trim()}
          style={{
            width: toLength(containerWidth),
            height: toLength(containerHeight),
            perspective: toLength(perspective),
            ...style
          }}
          data-interactive={interactive ? '' : undefined}
          data-flipped={isFlipped ? '' : undefined}
          tabIndex={interactive ? 0 : undefined}
          role={interactive ? 'button' : undefined}
          onClick={interactive ? (e) => toggle(e) : undefined}
        >
          <div
            ref={shadowRef}
            className="tilted-card__shadow"
            aria-hidden="true"
            style={{ width: toLength(imageWidth), height: toLength(imageHeight), borderRadius: corner }}
          />
          <div
            ref={bodyRef}
            className="tilted-card__body"
            style={{
              width: toLength(imageWidth),
              height: toLength(imageHeight),
              '--tc-radius': corner,
              '--tc-glare-rgb': glareRgb
            }}
          >
            <div className="tilted-card__face tilted-card__front">
              {imageSrc && (
                <img
                  className="tilted-card__img"
                  src={imageSrc}
                  alt={altText}
                  draggable={false}
                  style={{
                    '--tc-depth': -24,
                    top: `-${bleed}px`,
                    left: `-${bleed}px`,
                    width: `calc(100% + ${bleed * 2}px)`,
                    height: `calc(100% + ${bleed * 2}px)`
                  }}
                />
              )}
              {children}
              <span className="tilted-card__glare" aria-hidden="true" />
              <span className="tilted-card__rim" aria-hidden="true" />
              <span className="tilted-card__edge" aria-hidden="true" />
            </div>

    /* =========================================================================
       REACT BITS: SplitFlapText Component (Departure Board Animation)
       ========================================================================= */
    /* =========================================================================
       REACT BITS: SplitFlapText Component (Mechanical Departure Board)
       ========================================================================= */
    /* =========================================================================
       REACT BITS: SplitFlapText Component (Mechanical Departure Board)
       ========================================================================= */
    function SplitFlapText({
      text,
      words = [],
      fontSize = 28,
      tileColor = '#141210',
      textColor = '#EDE7DA',
      cycleDelay = 3200,
      stagger = 0.035,
      flipDuration = 0.075,
      loop = true,
      align = 'center',
      className = ''
    }) {
      const wordsList = words.length ? words : [text || 'TRENDING TRACKS'];
      const [wordIndex, setWordIndex] = useState(0);
      const currentTarget = wordsList[wordIndex] || '';

      const CHARSET = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/';
      const [displayedChars, setDisplayedChars] = useState(() => currentTarget.split(''));
      const [flippingIndices, setFlippingIndices] = useState(new Set());

      useEffect(() => {
        if (wordsList.length <= 1 && !loop) return undefined;
        const interval = setInterval(() => {
          setWordIndex((prev) => (prev + 1) % wordsList.length);
        }, cycleDelay);
        return () => clearInterval(interval);
      }, [wordsList.length, cycleDelay, loop]);

      useEffect(() => {
        const targetWord = wordsList[wordIndex] || '';
        const targetChars = targetWord.split('');
        const targetLen = targetChars.length;

        setDisplayedChars((prev) => {
          const next = [...prev];
          while (next.length < targetLen) next.push(' ');
          if (next.length > targetLen) next.length = targetLen;
          return next;
        });

        const activeTimeouts = [];

        for (let i = 0; i < targetLen; i++) {
          const targetChar = targetChars[i] || ' ';
          const delay = i * (stagger * 1000);
          const flips = 3 + Math.floor(Math.random() * 3);

          for (let f = 0; f <= flips; f++) {
            const flipDelay = delay + f * (flipDuration * 1000);
            const t = setTimeout(() => {
              setFlippingIndices((prev) => {
                const next = new Set(prev);
                next.add(i);
                return next;
              });

              setDisplayedChars((prev) => {
                const arr = [...prev];
                if (f === flips) {
                  arr[i] = targetChar;
                } else {
                  arr[i] = CHARSET[Math.floor(Math.random() * CHARSET.length)];
                }
                return arr;
              });

              setTimeout(() => {
                setFlippingIndices((prev) => {
                  const next = new Set(prev);
                  next.delete(i);
                  return next;
                });
              }, flipDuration * 1000);
            }, flipDelay);

            activeTimeouts.push(t);
          }
        }

        return () => activeTimeouts.forEach(clearTimeout);
      }, [wordIndex, wordsList]);

      const wordsArray = [];
      let currentWordChars = [];
      displayedChars.forEach((char, idx) => {
        if (char === ' ') {
          if (currentWordChars.length) {
            wordsArray.push(currentWordChars);
            currentWordChars = [];
          }
          wordsArray.push([{ char: ' ', index: idx, isSpace: true }]);
        } else {
          currentWordChars.push({ char, index: idx });
        }
      });
      if (currentWordChars.length) wordsArray.push(currentWordChars);

      return (
        <div
          className={`split-flap-container ${className}`.trim()}
          style={{
            fontSize: typeof fontSize === 'number' ? `${fontSize}px` : fontSize,
            '--sf-tile-color': tileColor,
            '--sf-text-color': textColor,
            justifyContent: align === 'center' ? 'center' : align === 'right' ? 'flex-end' : 'flex-start'
          }}
          aria-label={currentTarget}
        >
          {wordsArray.map((wordGroup, wIdx) => {
            if (wordGroup.length === 1 && wordGroup[0].isSpace) {
              return <span key={`space-${wIdx}`} className="split-flap-space" style={{ width: '0.42em' }} />;
            }
            return (
              <div key={`word-${wIdx}`} className="split-flap-word">
                {wordGroup.map(({ char, index }) => {
                  const isFlipping = flippingIndices.has(index);
                  return (
                    <div key={index} className="split-flap-tile">
                      <div className={`split-flap-half split-flap-top ${isFlipping ? 'split-flap-anim-down' : ''}`}>
                        <div className="split-flap-inner">
                          <span>{char}</span>
                        </div>
                      </div>
                      <div className={`split-flap-half split-flap-bottom ${isFlipping ? 'split-flap-anim-up' : ''}`}>
                        <div className="split-flap-inner">
                          <span>{char}</span>
                        </div>
                      </div>
                      <div className="split-flap-hinge" />
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      );
    }

    const ambientSynth = (() => {
      let timerId = null;
      let synth = null;
      let step = 0;

      const stop = () => {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        if (synth) {
          try {
            synth.releaseAll();
          } catch (e) {}
        }
      };

      const start = async (track) => {
        stop();
        if (!window.Tone) return;
        try {
          await window.Tone.start();
          if (!synth) {
            const reverb = new window.Tone.Reverb({ decay: 2.8, wet: 0.4 }).toDestination();
            synth = new window.Tone.PolySynth(window.Tone.Synth, {
              oscillator: { type: 'triangle' },
              envelope: { attack: 0.08, decay: 0.4, sustain: 0.25, release: 1.2 },
            }).connect(reverb);
            synth.volume.value = -16;
          }
          const notes = track.notes || [261.63, 329.63, 392.0, 493.88];
          const beatMs = Math.max(260, Math.round((60 / (track.bpm || 120)) * 1000));
          step = 0;
          const playStep = () => {
            if (!synth) return;
            const n = notes[step % notes.length];
            const chord = step % 4 === 0 ? [n, notes[(step + 2) % notes.length]] : [n];
            try {
              synth.triggerAttackRelease(chord, '4n');
            } catch (e) {}
            step += 1;
          };
          playStep();
          timerId = setInterval(playStep, beatMs);
        } catch (e) {
          /* Ignore audio context restriction errors gracefully */
        }
      };

      return { start, stop };
    })();

    /* =========================================================================

       ========================================================================= */
    function useLenis(onVelocity) {
      const lenisRef = useRef(null);

      useEffect(() => {
        if (getPrefersReducedMotion() || !window.Lenis) return undefined;

        const lenis = new window.Lenis({
          duration: 0.9,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true,
          wheelMultiplier: 1.05,
          touchMultiplier: 1.5,
        });
        lenisRef.current = lenis;

        lenis.on('scroll', (e) => {
          if (window.ScrollTrigger) window.ScrollTrigger.update();
          if (onVelocity) onVelocity(e.velocity || 0);
        });

        let rafId = null;
        const gsapTick = (time) => lenis.raf(time * 1000);

        if (window.gsap) {
          window.gsap.ticker.add(gsapTick);
          window.gsap.ticker.lagSmoothing(0);
        } else {
          const loop = (t) => {
            lenis.raf(t);
            rafId = requestAnimationFrame(loop);
          };
          rafId = requestAnimationFrame(loop);
        }

        return () => {
          if (window.gsap) window.gsap.ticker.remove(gsapTick);
          if (rafId) cancelAnimationFrame(rafId);
          lenis.destroy();
          lenisRef.current = null;
        };
      }, [onVelocity]);

      return lenisRef;
    }

    /* =========================================================================

       Renders richly shaded raster PNG stand-ins matched to your uploaded
       assets until local /public/assets/ files are placed on disk.
       ========================================================================= */
    function createRng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function applyCanvasGrain(ctx, w, h, strength = 10, seed = 42, preserveAlpha = false) {
      try {
        const img = ctx.getImageData(0, 0, w, h);
        const d = img.data;
        const rand = createRng(seed);
        for (let i = 0; i < d.length; i += 4) {
          if (preserveAlpha && d[i + 3] < 14) continue;
          const n = (rand() - 0.5) * strength * 2;
          d[i] = Math.max(0, Math.min(255, d[i] + n));
          d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
          d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
        }
        ctx.putImageData(img, 0, 0);
      } catch (e) {}
    }

    function drawPainterlyBlossom(ctx, cx, cy, scale = 1, rot = 0, ink = '#191715', petalLight = '#F2EBE0') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.scale(scale, scale);

      for (let i = 0; i < 5; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI * 2) / 5);
        const g = ctx.createRadialGradient(0, -14, 3, 0, -24, 34);
        g.addColorStop(0, '#443E37');
        g.addColorStop(0.32, petalLight);
        g.addColorStop(1, '#CFC4B4');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-18, -14, -22, -40, 0, -46);
        ctx.bezierCurveTo(22, -40, 18, -14, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.4;
        ctx.stroke();

        /* Halftone stipple near petal base */
        ctx.fillStyle = 'rgba(20,18,16,0.32)';
        for (let p = 0; p < 7; p++) {
          ctx.beginPath();
          ctx.arc((p - 3) * 3.4, -12 - (p % 3) * 4.5, 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      /* Stamens & center ink pistil */
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
      ctx.fill();
      for (let s = 0; s < 10; s++) {
        const a = (s * Math.PI * 2) / 10;
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 17, Math.sin(a) * 17, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const PNG_PAINTERS = {

            ctx.rotate((i * Math.PI * 2) / 5 - Math.PI / 2);

            ctx.beginPath();
            ctx.ellipse(26, -34, 18, 13, 0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.lineWidth = 6.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(38, -28);
            ctx.lineTo(118, -2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(126, -2);
            ctx.lineTo(86, 22);
            ctx.lineTo(94, 0);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
          }
          ctx.restore();
          applyCanvasGrain(ctx, w, h, 6, 514, true);
        },
      },

      musicCord: {
        w: 320,
        h: 480,
        paint(ctx, w, h) {
          ctx.save();
          ctx.scale(w / 240, h / 360);
          ctx.strokeStyle = '#141210';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          const drawClefPath = () => {
            ctx.beginPath();
            ctx.moveTo(114, 294);
            ctx.bezierCurveTo(152, 314, 162, 266, 146, 212);
            ctx.lineTo(118, 66);
            ctx.bezierCurveTo(112, 24, 144, 22, 148, 64);
            ctx.bezierCurveTo(150, 114, 72, 162, 72, 212);
            ctx.bezierCurveTo(72, 262, 168, 268, 174, 212);
            ctx.bezierCurveTo(178, 166, 114, 152, 108, 198);
            ctx.bezierCurveTo(104, 222, 128, 232, 138, 218);

          ctx.strokeStyle = '#141210';
          drawClefPath();
          ctx.stroke();

          ctx.fillStyle = '#141210';
          ctx.beginPath();
          ctx.arc(104, 286, 16, 0, Math.PI * 2);

          ctx.restore();

    const PNG_CACHE = new Map();
    function getGeneratedPngUrl(key) {
      if (!key) return Promise.resolve('');
      if (PNG_CACHE.has(key)) return PNG_CACHE.get(key);
      const spec = PNG_PAINTERS[key];
      if (!spec) return Promise.resolve('');

      const promise = new Promise((resolve) => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = spec.w;
          canvas.height = spec.h;
          const ctx = canvas.getContext('2d');
          spec.paint(ctx, spec.w, spec.h);
          if (canvas.toBlob) {
            canvas.toBlob((blob) => {
              if (blob) resolve(URL.createObjectURL(blob));
              else resolve(canvas.toDataURL('image/png'));
            }, 'image/png');
          } else {
            resolve(canvas.toDataURL('image/png'));
          }
        } catch (e) {
          resolve('');
        }
      });

      PNG_CACHE.set(key, promise);
      return promise;
    }

    function SmartAsset({ src, pngKey, alt = '', className = '', imgClassName = 'object-cover', lazy = true }) {

      useEffect(() => {
        const nextSrc = resolveAssetUrl(src);
        setActiveSrc(nextSrc);
        setUsedFallback(false);
      }, [src]);

      const handleError = useCallback(() => {
        if (usedFallback) return;
        setUsedFallback(true);
        getGeneratedPngUrl(pngKey).then((url) => {
          if (url) setActiveSrc(url);
        });
      }, [usedFallback, pngKey]);

      return (
        <div className={`w-full h-full relative ${className}`}>
          {activeSrc ? (
            <img

              loading={lazy ? 'lazy' : 'eager'}

    /* ReactBits-inspired Magnet Component (Restyled for VoidAntara) */
    function Magnet({ children, strength = 0.24, className = '' }) {
      const ref = useRef(null);

      const handleMove = (e) => {
        if (getPrefersReducedMotion() || !ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const dx = (e.clientX - (rect.left + rect.width / 2)) * strength;
        const dy = (e.clientY - (rect.top + rect.height / 2)) * strength;
        ref.current.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0)`;
      };

      const handleLeave = () => {
        if (ref.current) ref.current.style.transform = 'translate3d(0, 0, 0)';
      };

      return (
        <div
          ref={ref}
          onMouseMove={handleMove}
          onMouseLeave={handleLeave}
          className={`inline-block transition-transform duration-300 ease-out ${className}`}
        >
          {children}

    /* ReactBits-inspired Decrypted Pixel Text (Runs on intro + interactive hover) */
    function DecryptedPixelText({ text = 'Void', trigger = true, interactive = false }) {
      const [display, setDisplay] = useState(text);
      const intervalRef = useRef(null);

      const runScramble = useCallback(() => {
        if (getPrefersReducedMotion()) {
          setDisplay(text);
          return;
        }
        if (intervalRef.current) clearInterval(intervalRef.current);

        const glyphs = '▓▒░▪▫■□01V0ID';
        let frame = 0;
        const maxFrames = text.length * 4 + 4;
        intervalRef.current = setInterval(() => {
          frame += 1;
          const resolvedCount = Math.floor(frame / 4);
          const next = text
            .split('')
            .map((ch, idx) => {
              if (idx < resolvedCount) return ch;
              return glyphs[(frame + idx * 3) % glyphs.length];
            })
            .join('');
          setDisplay(next);
          if (frame >= maxFrames) {
            setDisplay(text);
            clearInterval(intervalRef.current);
            intervalRef.current = null;
          }
        }, 38);
      }, [text]);

      useEffect(() => {
        if (trigger) runScramble();
        return () => {
          if (intervalRef.current) clearInterval(intervalRef.current);
        };
      }, [trigger, runScramble]);

      return (
        <span
          onMouseEnter={interactive ? runScramble : undefined}
          className={interactive ? 'void-hover-interactive cursor-interactive' : ''}
        >
          {display}
        </span>
      );
    }
